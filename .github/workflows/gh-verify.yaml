name: Verify Grasshopper Files

on:
  pull_request:
    paths:
      - 'GrasshopperFiles/**.gh*'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - name: Install Linux image support
        run: sudo apt-get update && sudo apt-get install -y libgdiplus
      - name: Install GhTools
        run: dotnet tool install --global GhTools --version 3.0.0
      - name: Verify changed files
        env:
          BASE_REF: origin/${{ github.base_ref }}
          AFTER_SHA: ${{ github.sha }}
        shell: pwsh
        run: |
          $files = @(& ./.github/scripts/changed-files.ps1 -Before $env:BASE_REF -After $env:AFTER_SHA -MergeBase)
          New-Item -ItemType Directory -Force reports | Out-Null
          $failed = 0
          foreach ($file in $files) {
            if (-not (Test-Path $file)) { continue }
            $name = [IO.Path]::GetFileName($file)
            ghtools verify $file -o "reports/$name.verify.json"
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::error file=$file::verify failed"
              $failed++
            }
          }
          if ($failed -gt 0) { exit 1 }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: verify-reports
          path: reports/
